<!DOCTYPE html>
<html lang="pt-br" style="background-color: #0a0a0a;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - MeowMusic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Fundo geral pastel */
        html,
        body {
            background-color: #fdf6f9 !important;
            color: #5c5c6f;
            min-height: 100vh;
            margin: 0;
        }

        body {
            padding: 40px 10px;
            font-family: 'Poppins', sans-serif;
        }

        /* Caixa principal */
        .box {
            background-color: #ffffff;
            border: 1px solid #f3d7e3;
            color: #6c5b7b;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
        }

        /* Inputs e Select */
        .input,
        .select select {
            background-color: #ffffff;
            border: 1px solid #e8cfe0;
            color: #6c5b7b;
            border-radius: 8px;
            transition: 0.3s ease;
        }

        /* Focus suave */
        .input:focus,
        .select select:focus {
            border-color: #d8b4f8;
            box-shadow: 0 0 0 2px rgba(216, 180, 248, 0.2);
        }

        /* Tabela */
        .table {
            background-color: transparent;
            color: #6c5b7b;
        }

        /* Cabeçalho da tabela */
        .table thead th {
            color: #b39bc8;
            border-bottom: 1px solid #f3d7e3;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        /* Células */
        .table td {
            border-bottom: 1px solid #f3d7e3;
            vertical-align: middle;
        }

        /* Hover nas linhas */
        tr:hover {
            background-color: #f8e8f2 !important;
            transition: 0.2s ease;
        }

        /* Títulos */
        .title,
        .label {
            color: #6c5b7b !important;
        }

        /* Subtítulo com destaque pastel */
        .subtitle {
            color: #d8b4f8 !important;
        }
    </style>
</head>

<body>

    <div class="container">
        <header class="level mb-6">
            <div class="level-left">
                <div>
                    <h1 class="title is-3">Gestão de Conteúdo</h1>
                    <p class="subtitle is-6">Painel Administrativo</p>
                </div>
            </div>
            <div class="level-right">
                <a href="/" class="button is-dark">
                    <i class="fa-solid fa-house mr-2"></i> Voltar para o site
                </a>
            </div>
        </header>

        <div class="box">
            <h2 class="title is-5 mb-5">
                <i class="fa-solid fa-circle-plus has-text-success mr-2"></i> Nova Música
            </h2>
            <form action="./musica/post" method = "post">
                <div class="columns is-multiline">
                    <div class="column is-4">
                        <div class="field">
                            <label class="label is-small">Título da Música</label>
                            <div class="control">
                                <input name = "musica_input" class="input" type="text" placeholder="Ex: Starboy">
                            </div>
                        </div>
                    </div>
                    <div class="column is-4">
                        <div class="field">
                            <label class="label is-small">Cantor / Banda</label>
                            <div class="control">
                                <input name="cantor_input" class="input" type="text" placeholder="Ex: The Weeknd">
                            </div>
                        </div>
                    </div>
                    <div class="column is-4">
                        <div class="field">
                            <label class="label is-small">Duração</label>
                            <div class="control">
                                <input name= "duracao_input" class="input" type="text" placeholder="Ex: 03:50">
                            </div>
                        </div>
                    </div>
                    <div class="column is-8">
                        <div class="field">
                            <label class="label is-small">URL da Imagem de Capa</label>
                            <div class="control">
                                <input name="url_input" class="input" type="text" placeholder="https://...">
                            </div>
                        </div>
                    </div>
                    <div class="column is-4">
                        <div class="field">
                            <label name = "categoria_input" class="label is-small">Categoria</label>
                            <div class="control is-expanded">
                                <div class="select is-fullwidth">
                                    <select>
                                        {%for genero in generos %}
                                        <option value="{{nome_genero.nome}}">{{genero.nome}}Selecione...</option>
                                        {% endfor %}
                                        <option>Rock</option>
                                        <option>Pop</option>
                                        <option>Indie</option>
                                        <option>R&B Alternativo</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="button is-link is-fullwidth mt-4">
                    <strong><i class="fa-solid fa-save mr-2"></i> Salvar Música</strong>
                </button>
            </form>
        </div>

        <div class="box p-0" style="overflow-x: auto; border-radius: 6px;">
            <table class="table is-fullwidth">
                <thead>
                    <tr>
                        <th class="has-text-centered">ID</th>
                        <th>Capa</th>
                        <th>Título / Cantor</th>
                        <th class="has-text-centered">Duração</th>
                        <th>Categoria</th>
                        <th class="has-text-centered">Status</th>
                        <th class="has-text-right px-5">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for musica in musicas %}
                    <tr>
                        <td class="has-text-centered has-text-link is-family-monospace">1</td>
                        <td style="width: 80px;">
                            <figure class="image is-48x48">
                                <img src="{{musica.url_imagem}}" class="is-rounded" style="object-fit: cover;">
                            </figure>
                        </td>
                        <td>
                            <strong class="has-text-white">{{musica.nome}}</strong><br>
                            <small class="has-text-grey">{{musica.cantor}}</small>
                        </td>
                        <td class="is-family-monospace has-text-centered">04:12</td>
                        <td><span class="tag is-dark">{{musica.genero}}</span></td>
                        <td class="has-text-centered">
                            {% if musica.ativo %}
                            <span class="tag is-success is-light">ATIVO</span>
                            {% else %}
                            <span class="tag is-danger is-light">DESTIVADO</span>
                            {% endif %}
                        </td>
                        <td class="has-text-right px-5">
                            <div class="buttons is-right">
                                <button class="button is-small is-warning is-light" title="Desativar">
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                                <a href="/musica/delete/{{musica.codigo}}" class="button is-small is-danger is-light" title="Excluir">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                            {% endfor %}
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>

</html>
