<!DOCTYPE html> <!-- Define que o documento é HTML5 -->
<html lang="pt-br"> <!-- Início do HTML e define o idioma como português do Brasil -->

<head>
    <meta charset="UTF-8"> <!-- Define a codificação de caracteres para suportar acentos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Responsividade para dispositivos móveis -->
    <title>MeowMusic - Home</title> <!-- Título da aba do navegador -->

    <!-- Importação do framework CSS Bulma -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

    <!-- Importação dos ícones do Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pangolin&display=swap');

        :root {
            --rosa-pastel: #ffdef2;
            --rosa-escuro: #f2a2c0;
            --amarelo-pastel: #ffffd1;
            --roxo-suave: #d8b4f8;
            --texto-cor: #6c5b7b;
            --branco: #ffffff;
        }

        /* geral */
        body {
            background-color: #fdf6f9;
            background-image: radial-gradient(var(--rosa-pastel) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--texto-cor);
            min-height: 100vh;
            padding-top: 4.5rem;
            /* Aumentei para não cobrir o conteúdo */
            font-family: 'Pangolin', cursive !important;
        }

        /* navbar estilizada */
        .navbar {
            background-color: rgba(255, 238, 245, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 3px solid var(--rosa-pastel);
            height: 4rem;
        }

        .navbar-item strong {
            font-family: 'Pangolin', cursive;
            color: var(--rosa-escuro) !important;
            letter-spacing: 1px;
        }

        /* Barra de Pesquisa */
        .input.is-rounded {
            border: 2px solid var(--rosa-pastel) !important;
            background: white;
            font-family: 'Pangolin', cursive;
            height: 45px;
        }

        .input.is-rounded:focus {
            border-color: var(--roxo-suave) !important;
            box-shadow: 0 0 10px rgba(216, 180, 248, 0.3) !important;
        }

        .button.is-dark.is-rounded {
            background-color: var(--rosa-escuro) !important;
            height: 45px;
            padding: 0 20px;
        }

        /* Menu Lateral */
        .menu-label {
            color: var(--rosa-escuro) !important;
            font-size: 1rem;
            margin-bottom: 1rem;
            padding-left: 5px;
        }

        .menu-list a {
            color: var(--texto-cor) !important;
            border-radius: 15px;
            margin-bottom: 5px;
            transition: 0.3s;
        }

        .menu-list a:hover {
            background-color: var(--rosa-pastel) !important;
            transform: translateX(5px);
        }

        /* Cards das Músicas (O pulo do gato!) */
        .music-card {
            background-color: var(--branco);
            border: 3px solid var(--rosa-pastel);
            border-radius: 25px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
            box-shadow: 0 6px 0px var(--rosa-pastel);
            /* Efeito 3D */
        }

        .music-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(242, 162, 192, 0.3);
            border-color: var(--rosa-escuro);
        }

        .music-title {
            color: var(--texto-cor) !important;
            font-family: 'Pangolin', cursive;
            font-weight: bold;
            font-size: 1.1rem !important;
        }

        .music-singer {
            color: #a393b7;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 10px;
        }

        /* Imagem do Card */
        .card-image img {
            border-bottom: 3px solid var(--rosa-pastel);
            transition: 0.5s;
        }

        .music-card:hover .card-image img {
            transform: scale(1.05);
        }

        /* Tags */
        .tag.is-dark {
            background-color: var(--roxo-suave) !important;
            border-radius: 10px;
            font-family: 'Pangolin', cursive;
        }

        .tag.is-black {
            background-color: var(--amarelo-pastel) !important;
            color: var(--texto-cor) !important;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Botão Admin */
        .button.is-link {
            background-color: var(--amarelo-pastel) !important;
            color: var(--texto-cor) !important;
            border: 2px solid var(--rosa-pastel) !important;
            border-radius: 15px;
            font-weight: bold;
        }

        .icon-youtube {
            color: var(--rosa-escuro) !important;
        }
    </style>
</head>

<body> <!-- Início do corpo da página -->

    <!-- Barra de navegação fixa no topo -->
    <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="container is-fluid"> <!-- Container fluido do Bulma -->

            <!-- Parte esquerda da navbar (logo) -->
            <div class="navbar-brand">
                <a class="navbar-item" href="/"> <!-- Link para a página inicial -->
                    <i class="fa-brands fa-youtube icon-youtube is-size-3 mr-2"></i> <!-- Ícone do YouTube -->
                    <strong class="has-text-white is-size-4">MeowMusic</strong> <!-- Nome do site -->
                </a>
            </div>

            <div class="navbar-menu"> <!-- Menu principal da navbar -->

                <!-- Parte central da navbar (barra de pesquisa) -->
                <div class="navbar-end"
                    style="flex-grow: 1; justify-content: center; display: flex; align-items: center;">
                    <div class="field has-addons" style="width: 50%;"> <!-- Campo com botão acoplado -->
                        <div class="control is-expanded">
                            <input class="input is-rounded" type="text" placeholder="Pesquisar músicas...">
                            <!-- Campo de pesquisa -->
                        </div>
                        <div class="control">
                            <button class="button is-dark is-rounded"> <!-- Botão de pesquisa -->
                                <i class="fa-solid fa-magnifying-glass"></i> <!-- Ícone de lupa -->
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Parte direita da navbar (botão admin) -->
                <div class="navbar-end">
                    <div class="navbar-item">
                        <a href="/admin" class="button is-link"> <!-- Link para área administrativa -->
                            <i class="fa-solid fa-user-shield mr-2"></i> Admin <!-- Ícone de administrador -->
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Seção principal da página -->
    <div class="section">
        <div class="columns"> <!-- Sistema de colunas do Bulma -->

            <!-- Menu lateral (visível apenas em telas maiores) -->
            <aside class="column is-2 is-hidden-mobile">
                <div class="menu">
                    <p class="menu-label">Categorias</p> <!-- Título do menu -->
                    <ul class="menu-list">
                        <!-- Lista de categorias -->
                        <li><a href="#"><span class="icon"><i class="fa-solid fa-compact-disc"></i></span> Rock</a></li>
                        <li><a href="#"><span class="icon"><i class="fa-solid fa-compact-disc"></i></span> Pop</a></li>
                    </ul>
                </div>
            </aside>

            <!-- Conteúdo principal -->
            <main class="column">
                <div class="columns is-multiline"> <!-- Permite múltiplas linhas de cards -->
                    {% for musica in musicas %}
                    <!-- Coluna responsiva do card -->
                    <div class="column is-12-mobile is-6-tablet is-4-desktop is-3-widescreen">
                        <div class="music-card"> <!-- Card da música -->

                            <!-- Imagem da música -->
                            <div class="card-image">
                                <figure class="image">
                                    <img src="{{musica.url_imagem}}" alt="Capa">
                                </figure>
                            </div>

                            <!-- Conteúdo textual do card -->
                            <div class="card-content p-4">
                                <span class="music-title is-size-6">{{musica.nome}}</span> <!-- Título -->

                                <span class="music-singer">
                                    <i class="fa-solid fa-microphone-lines mr-1"></i>{{musica.cantor}}
                                    <!-- Nome do cantor -->
                                </span>

                                <!-- Tags de categoria e duração -->
                                <div class="tags flex justify-between">
                                    <span class="tag is-dark">Categoria</span> <!-- Categoria -->
                                    <span
                                        class="tag is-black has-text-grey-light is-family-monospace">{{musica.duração}}</span>
                                    <!-- Duração -->


                                </div>
                            </div>

                        </div>
                    </div>
                    {%endfor%}
                </div>
            </main>
        </div>
    </div>
</body>

</html>
