<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro ✨</title>
    @import url('https://fonts.googleapis.com/css2?family=Pangolin&display=swap');

    <style>
        :root {
            --rosa-pastel: #ffdef2;
            --rosa-vibrante: #f592bf;
            --amarelo-pastel: #ffffd1;
            --texto-cor: #6c5b7b;
            --branco-transparente: rgba(255, 255, 255, 0.7);
        }

        body {
            background-color: var(--amarelo-pastel) !important;
            /* Fundo com bolinhas delicadas */
            background-image: radial-gradient(var(--rosa-pastel) 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            
            color: var(--texto-cor);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pangolin', cursive;
        }

        /* O formulário agora é uma caixinha mágica */
        form {
            background: var(--branco-transparente);
            backdrop-filter: blur(15px); /* Efeito de vidro embaçado */
            -webkit-backdrop-filter: blur(15px);
            
            border: 4px solid var(--rosa-pastel);
            border-radius: 30px;
            padding: 2.5rem;
            width: 320px;
            box-shadow: 0 10px 25px rgba(245, 146, 191, 0.2);
            text-align: center;
        }

        h1 {
            color: var(--rosa-vibrante);
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 0px white;
        }

        /* Estilizando os labels (usuario: e senha:) */
        form {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--texto-cor);
        }

        /* Estilizando os campos de texto */
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 2px solid var(--rosa-pastel);
            border-radius: 15px;
            background: white;
            font-family: 'Pangolin', cursive;
            font-size: 1rem;
            color: var(--texto-cor);
            outline: none;
            box-sizing: border-box; /* Garante que o padding não quebre a largura */
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--rosa-vibrante);
            box-shadow: 0 0 8px rgba(245, 146, 191, 0.3);
            transform: scale(1.02);
        }

        /* Botão fofinho de cadastrar */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 20px;
            background-color: var(--rosa-vibrante);
            color: white;
            font-family: 'Pangolin', cursive;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 5px solid #d4709d; /* Efeito 3D */
            box-shadow: 0 4px 10px rgba(245, 146, 191, 0.3);
        }

        button:hover {
            filter: brightness(1.05);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* Pequeno detalhe decorativo */
        form::after {
            display: block;
            margin-top: 15px;
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <form action="/cadastrar/post" method="post">
        <h1> ୧ ‧₊˚ welcome !🌺 ⋅ ☆ </h1>
        
        <label>usuário: (✿◠‿◠)</label>
        <input name="usuario" placeholder="digite seu nome...">
        
        <label>senha: (－ｏ－) zzZ</label>
        <input name="senha" type="password" placeholder="sua senha secreta...">
        
        <a href="/admin"><button type="submit">cadastrar! ✨</button></a>
    </form>
</body>

</html>
